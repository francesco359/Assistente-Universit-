<!doctype html><html lang="it"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>LectureForge</title><link rel="stylesheet" href="/static/app.css"></head><body><header><h1>LectureForge</h1><p>Registrazioni, file dei docenti e chat AI → mappe, quiz e flashcard</p></header><main><section class="card"><h2>1. Crea un corso</h2><form id="course"><input id="name" required placeholder="Es. Statistica per l'economia"><button>Crea</button></form></section><section class="card"><h2>2. Seleziona corso e carica materiali</h2><select id="cid"><option value="">Seleziona...</option>{% for c in courses %}<option value="{{c.id}}">{{c.name}}</option>{% endfor %}</select><form id="upload"><select id="kind"><option value="document">Dispensa / slide / dati</option><option value="chat">Chat AI precedenti</option><option value="transcript">Trascrizione lezione</option></select><input id="files" type="file" multiple required><button>Carica</button></form><div id="uploadResult"></div></section><section class="card"><h2>3. Genera</h2><input id="title" value="Materiale di studio"><input id="count" type="number" min="5" max="50" value="20"><button onclick="generate()">Genera mappa, quiz e flashcard</button><div id="generated"></div></section></main><script src="/static/app.js"></script></body></html>
